[package]
name = "merton-bin-collection"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
reqwest = { version = "0.12", features = ["json", "cookies"] }
scraper = "0.22"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"], optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[features]
default = ["time"]
time = ["dep:time"]
chrono = ["dep:chrono"]
